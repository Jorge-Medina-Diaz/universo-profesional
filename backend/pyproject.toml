[project]
name = "cvs-saas-backend"
version = "0.1.0"
description = "Universo Profesional — backend FastAPI + MCP server"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Jorge", email = "jorge@webtools.es" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    # ASGI toolkit (FastAPI dependency)
    "starlette>=0.40.0",
    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Pydantic email validation
    "email-validator>=2.2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # Alembic sync driver
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # Auth & crypto
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "authlib>=1.3.2",
    "cryptography>=43.0.0",
    # MCP
    "mcp>=1.1.0,<2.0.0",
    # Agents (Agno + LLM providers)
    "agno>=2.6.7,<3.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    # Queue
    "arq>=0.26.3",
    "redis>=5.2.0",
    # Documents
    "weasyprint>=63.0",
    "python-docx>=1.1.2",
    "jinja2>=3.1.4",
    # Files / parsing
    "pypdf>=5.1.0",
    # Graph / ontology / retrieval (Universe v2)
    "python-igraph>=0.11.6",  # Personalized PageRank snapshots (per-user)
    "scikit-learn>=1.5.2",    # PCA + IsolationForest + LOF outlier ensemble
    "jellyfish>=1.1.0",       # phonetic + string similarity for entity resolution
    # HTTP client
    "httpx>=0.27.2",
    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    # Mail (mock via SMTP to mailhog)
    "aiosmtplib>=3.0.2",
    # Utils
    # FastAPI form parsing (OAuth token endpoint)
    "python-multipart>=0.0.17",
    # Retry logic (LLM calls, external APIs)
    "tenacity>=9.0.0",
    # FastAPI performance: JSON serialization
    "orjson>=3.10.11",
    # Rate limiting (Redis-backed)
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.18.0",
    # slowapi rate-limit backend
    "limits[redis]>=3.13.0",
    # AG-UI protocol (agent streaming)
    "ag-ui-protocol>=0.1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "types-jsonschema>=4.23.0",
    "import-linter>=2.1",
    "locust>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC", # async best practices
    "PL",   # pylint
    "PIE",
    "RET",
    "TID",
    "S",    # bandit security
]
ignore = [
    "PLR0913",  # too many arguments — common in DDD use cases
    "PLR2004",  # magic values — DDD often uses literal validation
    "E501",     # line length — handled by formatter
    # Bandit rules with pre-existing debt in src/; ratchet up in v1.1
    "S101",     # assert in src/ — used for internal invariants
    "S105",     # hardcoded password strings — mostly URL tokens / defaults
    "S107",     # hardcoded password in function defaults
    "S110",     # try-except-pass — deferred cleanup
    "S112",     # try-except-continue — deferred cleanup
    "S301",     # pickle usage — internal serialization only
    "S608",     # SQL string formatting — registry-driven, not user input
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "ARG", "N806", "PLC0415"]
"alembic/**/*.py" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["weasyprint.*", "docx.*", "pgvector.*", "arq.*", "authlib.*", "jose.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:authlib.*",
    "ignore::DeprecationWarning:passlib.*",
    # pytest-asyncio 0.24 still emits an unclosed-loop DeprecationWarning at
    # teardown of the session-scoped event_loop fixture. The pinned version
    # closes the loop for us; the warning is cosmetic, so don't fail on it.
    "ignore::DeprecationWarning:pytest_asyncio.*",
    # Redis async connections and ASGI transports sometimes emit ResourceWarning
    # during session teardown after the event loop has closed; suppress the
    # pytest wrapper so it doesn't fail the suite.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "unit: pure domain/application logic, no IO",
    "integration: hits database or redis",
    "e2e: full API or MCP flow",
    "slow: takes >1s",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# NOTE: import-linter config lives in `backend/.importlinter` (the correct
# per-bounded-context contract). It must NOT be duplicated here — import-linter
# prefers pyproject.toml when present, and the old flat contract here
# (src.interfaces/src.infrastructure/...) does not match this DDD layout, so it
# passed vacuously while the real contract never ran. See AGENTS.md §13.5.
