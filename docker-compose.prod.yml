# Production-flavoured compose file. Drop-in alternative to `docker-compose.yml`
# when you don't want to use Fly.io / managed services.
#
# Differences vs the dev file:
#   * No source bind-mounts — images are immutable.
#   * No MailHog — emails go through the configured provider (Brevo by default).
#   * `restart: unless-stopped` everywhere so we recover from OOM kills, etc.
#   * Frontend served by nginx on port 8080 (not Vite dev server).
#   * postgres + redis kept here for simplicity; on Fly.io / Railway you'd
#     use the managed offerings and remove these services.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Required env vars are documented in `.env.example`. The compose file
# fails loud on missing required ones (`${VAR:?message}` syntax).

services:
  postgres:
    build:
      context: ./docker
      dockerfile: postgres.Dockerfile
    image: cvs-saas-postgres:latest
    container_name: cvs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-cvs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cvs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    image: ${BACKEND_IMAGE:-cvs-saas-backend:latest}
    container_name: cvs-backend
    restart: unless-stopped
    environment:
      ENV: ${ENV:-staging}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      CANONICAL_BASE_URL: ${CANONICAL_BASE_URL:?CANONICAL_BASE_URL required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS required}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM required}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Universo Profesional}
      BREVO_API_KEY: ${BREVO_API_KEY}
      AGENTS_PROVIDER: ${AGENTS_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STRIPE_PROVIDER: ${STRIPE_PROVIDER:-real}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${STRIPE_PRICE_PREMIUM_MONTHLY}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      SENTRY_DSN: ${SENTRY_DSN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_VERIFY_EMAILS_IN_DEV: "false"
      DATABASE_ECHO: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: cvs-saas-backend:latest
    container_name: cvs-worker
    restart: unless-stopped
    environment:
      ENV: ${ENV:-staging}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      CANONICAL_BASE_URL: ${CANONICAL_BASE_URL:?CANONICAL_BASE_URL required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM required}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Universo Profesional}
      BREVO_API_KEY: ${BREVO_API_KEY}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY required}
      AGENTS_PROVIDER: ${AGENTS_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "src.shared.worker.WorkerSettings"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.prod.Dockerfile
      args:
        # SAME-ORIGIN: this image's nginx proxies /api, /agui, /mcp to the
        # backend (see docker/nginx.conf), so the SPA must use RELATIVE URLs.
        # Default empty → CopilotKit's runtimeUrl resolves to "/agui" and is
        # proxied same-origin (no CORS, CSP-clean). Baking an absolute URL here
        # (the old ${FRONTEND_BASE_URL} default) is what broke the chat:
        # CopilotKit went cross-origin to :8000 and was blocked. Only override
        # VITE_API_BASE_URL if the backend is on a genuinely different origin
        # with no proxy in front.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: ${FRONTEND_IMAGE:-cvs-saas-frontend:latest}
    container_name: cvs-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cvs-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MH_UI_BIND_ADDR: 0.0.0.0:8025
      MH_API_BIND_ADDR: 0.0.0.0:8025
      MH_SMTP_BIND_ADDR: 0.0.0.0:1025

volumes:
  postgres_data:
  redis_data:
  backend_var:
