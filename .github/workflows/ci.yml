name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token. `packages: read` is required so the Postgres service
# containers can pull the AGE-enabled ghcr.io/<owner>/cvs-postgres image — the
# default token on pull_request events does NOT include package-read scope.
permissions:
  contents: read
  packages: read

jobs:
  # -------------------------------------------------------------------------
  # Backend — lint, type-check, import-linter, pytest with coverage.
  # Runs sequentially (single process) because DB tests share one Postgres
  # instance; the conftest fixture uses DELETE FROM users CASCADE to stay
  # deadlock-free, but we still avoid xdist parallelism in CI for stability.
  # -------------------------------------------------------------------------
  backend:
    name: backend lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # AGE-enabled Postgres (pgvector + Apache AGE) — the same image dev/prod
        # use, built + pushed by publish-postgres.yml. REQUIRED: the AGE
        # foundation migration runs `CREATE EXTENSION age` unguarded, so against
        # the vanilla pgvector image `alembic upgrade head` would fail and no
        # AGE-dependent code path would ever run in CI (the divergence the audit
        # flagged). The package is public, so no pull credentials are needed.
        # Owner is hardcoded lowercase on purpose: `github.repository_owner`
        # renders as `Jorge-Medina-Diaz`, and Docker rejects any uppercase in a
        # repository name ("must be lowercase"), so the service container failed
        # to initialize before a single step could run. The publish workflow gets
        # away with the expression because metadata-action lowercases for you.
        image: ghcr.io/jorge-medina-diaz/cvs-postgres:pg16
        env:
          POSTGRES_USER: cvs
          POSTGRES_PASSWORD: cvs_dev_password
          POSTGRES_DB: cvs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cvs -d cvs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup WeasyPrint system dependencies
        uses: ./.github/actions/setup-weasyprint
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install deps
        working-directory: backend
        run: |
          uv sync --all-extras
      - name: Provision test database (cvs_test) + extensions
        env:
          PGPASSWORD: cvs_dev_password
        run: |
          sudo apt-get install -y postgresql-client
          # The conftest guard refuses to clean any DB whose name lacks 'test';
          # the suite runs against a dedicated cvs_test database.
          psql -h localhost -U cvs -d cvs -c "CREATE DATABASE cvs_test OWNER cvs;"
          # The AGE image ships a sane '"$user", public, ag_catalog' default,
          # but pin it per-DB anyway: with ag_catalog first, a from-scratch
          # migration sends every unqualified CREATE TABLE into ag_catalog.
          psql -h localhost -U cvs -d cvs -c "ALTER DATABASE cvs_test SET search_path = \"\$user\", public, ag_catalog;"
          psql -h localhost -U cvs -d cvs_test -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS age;"
      - name: Alembic migrate (as owner)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cvs:cvs_dev_password@localhost:5432/cvs_test
          DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@localhost:5432/cvs_test
        run: uv run alembic upgrade head
      - name: Provision RLS-subject runtime role (cvs_app)
        env:
          PGPASSWORD: cvs_dev_password
        run: |
          # Tests run as the same NOSUPERUSER NOBYPASSRLS role the app uses in
          # prod — otherwise RLS enforcement is fictional in CI (superusers
          # bypass FORCE RLS unconditionally).
          psql -h localhost -U cvs -d cvs_test -f backend/scripts/provision_app_role.sql
          psql -h localhost -U cvs -d cvs_test -c "ALTER ROLE cvs_app PASSWORD 'cvs_app_ci_password';"
      # Linting — must pass before merge.
      - name: Ruff
        working-directory: backend
        run: uv run ruff check src tests
      # Type checking — RATCHET, not a pass/fail gate.
      #
      # This codebase was written before `mypy --strict` was ever run against
      # it (the pipeline itself had never executed — no remote). The count is
      # down from 541 to 181 via structural fixes, not suppressions. Failing
      # the build on the remainder would mean either blocking every change
      # until they are all annotated, or gutting the config — so instead the
      # build fails if the number goes UP. It can only ratchet down.
      #
      # Lower MYPY_MAX as errors are fixed. Do not raise it.
      - name: Mypy (ratchet)
        working-directory: backend
        env:
          MYPY_MAX: "180"
        run: |
          set +e
          OUT=$(uv run mypy src 2>&1)
          echo "$OUT" | tail -30
          COUNT=$(echo "$OUT" | grep -cE '^src/.*: error:')
          echo "::notice::mypy errors: $COUNT (ceiling: $MYPY_MAX)"
          if [ "$COUNT" -gt "$MYPY_MAX" ]; then
            echo "::error::mypy regressed: $COUNT > $MYPY_MAX"
            exit 1
          fi
      # Import-linter enforces Clean Architecture layering rules.
      - name: Import-linter
        working-directory: backend
        run: uv run lint-imports
      # Guard against marker rot: the requires_age suite must still exist —
      # combined with the conftest fail-not-skip guard this keeps the build
      # honest about the graph engine actually being exercised.
      # Runs with the same env as the pytest step below. Without it, conftest
      # falls back to its localhost defaults and collection can die before it
      # reaches a single test — which is exactly what happened, invisibly,
      # because this step used to send stderr to /dev/null. Never hide the
      # output of a check you intend to gate on.
      - name: Assert AGE-marked tests are collected
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cvs_app:cvs_app_ci_password@localhost:5432/cvs_test
          DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@localhost:5432/cvs_test
          REDIS_URL: redis://localhost:6379/1
          ENV: test
          CANONICAL_BASE_URL: http://test
          FRONTEND_BASE_URL: http://test
          STORAGE_ROOT: /tmp/cvs-docs
          JWT_PRIVATE_KEY_PATH: /tmp/jwt_priv.pem
          JWT_PUBLIC_KEY_PATH: /tmp/jwt_pub.pem
          EMAIL_HOST: localhost
          EMAIL_PORT: "1025"
        run: |
          mkdir -p /tmp/cvs-docs
          set +e
          OUT=$(uv run pytest -m requires_age --collect-only -q 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          # `grep -c` exits 1 on zero matches, so it needs `|| true` even though
          # we only want the number — without it this line aborts the step under
          # `set -e` before anything gets reported.
          COUNT=$(echo "$OUT" | grep -c "::" || true)
          if [ "$COUNT" -lt 3 ]; then
            # Surface the reason as an annotation, not just in the log body.
            echo "::error::requires_age collection failed (pytest rc=$RC, matches=$COUNT) :: $(echo "$OUT" | grep -vE '^\s*$' | tail -6 | tr '\n' ' ~ ')"
            exit 1
          fi
          echo "::notice::requires_age tests collected: $COUNT"
      # Test suite — RATCHET, same rationale as mypy above. 867 pass, 51 fail
      # (the suite had literally never been executed: no remote, so no CI). The
      # build fails if the failure count goes UP. Lower the ceiling as they are
      # fixed; do not raise it. Single process avoids DB contention; runs as
      # cvs_app (the RLS-subject role) — alembic stays on the owner.
      - name: Pytest (ratchet) with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cvs_app:cvs_app_ci_password@localhost:5432/cvs_test
          DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@localhost:5432/cvs_test
          REDIS_URL: redis://localhost:6379/1
          ENV: test
          CANONICAL_BASE_URL: http://test
          FRONTEND_BASE_URL: http://test
          STORAGE_ROOT: /tmp/cvs-docs
          JWT_PRIVATE_KEY_PATH: /tmp/jwt_priv.pem
          JWT_PUBLIC_KEY_PATH: /tmp/jwt_pub.pem
          EMAIL_HOST: localhost
          EMAIL_PORT: "1025"
          # 52, not 51. The original ceiling was measured on Windows against a
          # local venv; in a CI-equivalent container (Linux, Python 3.13, AGE
          # Postgres, running as cvs_app) the suite is 52 failed / 866 passed.
          # Verified as environment variance, not a regression: the pre-session
          # baseline commit scores exactly 52/866 in that same container too.
          PYTEST_MAX_FAILURES: "52"
        run: |
          mkdir -p /tmp/cvs-docs
          set +e
          uv run pytest -q --cov=src --cov-report=xml --cov-report=term > pytest.log 2>&1
          set -e
          tail -60 pytest.log
          FAILED=$(grep -c '^FAILED' pytest.log || true)
          echo "::notice::pytest failures: $FAILED (ceiling: $PYTEST_MAX_FAILURES)"
          if [ "$FAILED" -gt "$PYTEST_MAX_FAILURES" ]; then
            echo "::error::pytest regressed: $FAILED > $PYTEST_MAX_FAILURES"
            exit 1
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # -------------------------------------------------------------------------
  # Frontend — lint, type-check, unit tests, and production build.
  # -------------------------------------------------------------------------
  frontend:
    name: frontend lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm install --include=dev
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  # -------------------------------------------------------------------------
  # End-to-end — Playwright browser tests against the running backend.
  # -------------------------------------------------------------------------
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # AGE-enabled Postgres (pgvector + Apache AGE) — the same image dev/prod
        # use, built + pushed by publish-postgres.yml. REQUIRED: the AGE
        # foundation migration runs `CREATE EXTENSION age` unguarded, so against
        # the vanilla pgvector image `alembic upgrade head` would fail and no
        # AGE-dependent code path would ever run in CI (the divergence the audit
        # flagged). The package is public, so no pull credentials are needed.
        # Owner is hardcoded lowercase on purpose: `github.repository_owner`
        # renders as `Jorge-Medina-Diaz`, and Docker rejects any uppercase in a
        # repository name ("must be lowercase"), so the service container failed
        # to initialize before a single step could run. The publish workflow gets
        # away with the expression because metadata-action lowercases for you.
        image: ghcr.io/jorge-medina-diaz/cvs-postgres:pg16
        env:
          POSTGRES_USER: cvs
          POSTGRES_PASSWORD: cvs_dev_password
          POSTGRES_DB: cvs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cvs -d cvs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Setup WeasyPrint system dependencies
        uses: ./.github/actions/setup-weasyprint
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras
      - name: Ensure extensions + sane search_path
        env:
          PGPASSWORD: cvs_dev_password
        run: |
          sudo apt-get install -y postgresql-client
          # Pin public-first search_path BEFORE migrating: older published
          # images default to ag_catalog-first, which sends a from-scratch
          # migration's unqualified CREATE TABLEs into ag_catalog.
          psql -h localhost -U cvs -d cvs -c "ALTER DATABASE cvs SET search_path = \"\$user\", public, ag_catalog;"
          psql -h localhost -U cvs -d cvs -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS age;"
      - name: Alembic migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cvs:cvs_dev_password@localhost:5432/cvs
          DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@localhost:5432/cvs
        run: uv run alembic upgrade head
      - name: Generate JWT keys
        run: |
          mkdir -p /tmp/cvs-keys
          openssl genrsa -out /tmp/cvs-keys/jwt_priv.pem 2048
          openssl rsa -in /tmp/cvs-keys/jwt_priv.pem -pubout -out /tmp/cvs-keys/jwt_pub.pem
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cvs:cvs_dev_password@localhost:5432/cvs
          DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@localhost:5432/cvs
          REDIS_URL: redis://localhost:6379/1
          ENV: test
          CANONICAL_BASE_URL: http://localhost:8000
          FRONTEND_BASE_URL: http://localhost:5173
          # e2e/global-setup.ts registers a user and immediately logs in. Login
          # returns 401 for an unverified account, so without this the setup
          # stored a token-less session and every authenticated spec redirected
          # to /login. Safe by construction: use_cases.py only honours the flag
          # when is_dev or is_test, and validate_production_ready() rejects it
          # outright under ENV=production.
          AUTO_VERIFY_EMAILS_IN_DEV: "true"
          STORAGE_ROOT: /tmp/cvs-docs
          JWT_PRIVATE_KEY_PATH: /tmp/cvs-keys/jwt_priv.pem
          JWT_PUBLIC_KEY_PATH: /tmp/cvs-keys/jwt_pub.pem
          EMAIL_HOST: localhost
          EMAIL_PORT: "1025"
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          mkdir -p /tmp/cvs-docs
          # `python -m src.main` imported the module and exited: main.py only
          # does `app = create_app()`, with no __main__ block and no
          # uvicorn.run. Nothing ever listened on :8000, and the wait below was
          # an unbounded `until curl`, so this step spun until the job's 30 min
          # timeout — the e2e job could never pass. Use the same command
          # docker-compose uses, and bound the wait so a dead backend fails
          # fast and prints its log instead of hanging.
          uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/healthz >/dev/null && break
            sleep 2
          done
          if ! curl -sf http://localhost:8000/healthz; then
            echo "::error::backend did not become healthy within 120s"
            cat /tmp/backend.log
            exit 1
          fi
          echo "backend healthy"
      - name: Install frontend deps
        working-directory: frontend
        run: npm install --include=dev
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # -------------------------------------------------------------------------
  # Security — Trivy filesystem + image scan for CRITICAL/HIGH vulnerabilities.
  # Blocking: no continue-on-error.  Fails the pipeline on unfixed issues.
  # -------------------------------------------------------------------------
  security:
    name: trivy + secret scan + image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        # Context is ./backend, matching docker-compose.yml — the Dockerfile does
        # `COPY pyproject.toml`, which does not exist at the repo root. (The
        # frontend image below is the opposite: it COPYs frontend/ and docker/,
        # so its context really is the repo root.)
        run: docker build -f docker/backend.Dockerfile -t cvs-saas-backend:latest ./backend
      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: cvs-saas-backend:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Build frontend image
        run: docker build -f docker/frontend.prod.Dockerfile -t cvs-frontend:ci .
      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: cvs-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
