name: cvs-saas

services:
  postgres:
    build:
      context: ./docker
      dockerfile: postgres.Dockerfile
    image: cvs-saas/postgres-age:pg16
    container_name: cvs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvs
      POSTGRES_PASSWORD: cvs_dev_password
      POSTGRES_DB: cvs
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # AGE requires being preloaded; pass the flag directly so it survives
    # docker-compose overriding the image's default CMD.
    command:
      - postgres
      - -c
      - shared_preload_libraries=age
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvs -d cvs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cvs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cvs-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5

  esco-seed:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: runtime
    container_name: cvs-esco-seed
    environment:
      DATABASE_URL: postgresql+asyncpg://cvs:cvs_dev_password@postgres:5432/cvs
      DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@postgres:5432/cvs
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-development}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-deterministic}
      AUTO_SEED_ESCO: "true"
      ESCO_VERSION: ${ESCO_VERSION:-sample}
      ESCO_DOWNLOAD_URL: ${ESCO_DOWNLOAD_URL:-}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app
      - backend_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head || true; python -m scripts.seed_esco --sample-only"
    restart: on-failure

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    container_name: cvs-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cvs:cvs_dev_password@postgres:5432/cvs
      DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@postgres:5432/cvs
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      JWT_PRIVATE_KEY_PATH: /app/var/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/var/keys/jwt_public.pem
      STORAGE_ROOT: /app/var/documents
      CANONICAL_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # Providers — overridable from .env. Defaults keep dev offline. With the
      # unified resolution, a bare ANTHROPIC_API_KEY/OPENAI_API_KEY already
      # upgrades agents+llm+embeddings even if these stay at their defaults.
      ENV: ${ENV:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-deterministic}
      AGENTS_PROVIDER: ${AGENTS_PROVIDER:-mock}
      AGENTS_COORDINATOR_MODEL: ${AGENTS_COORDINATOR_MODEL:-claude-sonnet-4-6}
      AGENTS_SPECIALIST_MODEL: ${AGENTS_SPECIALIST_MODEL:-claude-haiku-4-5-20251001}
      AUTO_VERIFY_EMAILS_IN_DEV: ${AUTO_VERIFY_EMAILS_IN_DEV:-false}
      # Secrets pulled from .env (raíz del repo, gitignored). Empty string when
      # not set, which keeps the *_configured flags `false` in the status probe.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      # Email (real provider when EMAIL_PROVIDER=brevo|postmark)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@cvs-saas.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Universo Profesional}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      # Stripe (real when STRIPE_PROVIDER=real)
      STRIPE_PROVIDER: ${STRIPE_PROVIDER:-mock}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${STRIPE_PRICE_PREMIUM_MONTHLY:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
      # Integrations (OAuth + scraping)
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
      BRIGHTDATA_DATASET_ID: ${BRIGHTDATA_DATASET_ID:-gd_l1viktl72bvl7bjuj0}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_DMA_ENABLED: ${LINKEDIN_DMA_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      esco-seed:
        condition: service_completed_successfully
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/worker.Dockerfile
      target: runtime
    restart: unless-stopped
    container_name: cvs-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://cvs:cvs_dev_password@postgres:5432/cvs
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/var/documents
      CANONICAL_BASE_URL: http://localhost:8000
      PYTHONUNBUFFERED: "1"
      ENV: ${ENV:-development}
      # The worker runs LLM extraction, embedding refresh, OAuth-token-
      # decrypting syncs and email sends — so it needs the SAME secrets as
      # the backend (it had none before, silently no-op'ing those tasks).
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-deterministic}
      AGENTS_PROVIDER: ${AGENTS_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@cvs-saas.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Universo Profesional}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
      BRIGHTDATA_DATASET_ID: ${BRIGHTDATA_DATASET_ID:-gd_l1viktl72bvl7bjuj0}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_DMA_ENABLED: ${LINKEDIN_DMA_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./backend:/app
      - backend_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq src.shared.worker.WorkerSettings

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped
    container_name: cvs-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  backend_var:
  frontend_node_modules:
