name: cvs-saas

# Env shared by the backend API and the arq worker — the worker runs the same
# LLM/embedding/OAuth-sync/email tasks, so it needs the same providers + secrets.
x-shared-env: &shared-env
  # Runtime connects as the RLS-subject role (NOSUPERUSER NOBYPASSRLS).
  DATABASE_URL: postgresql+asyncpg://cvs_app:cvs_app_dev_password@postgres:5432/cvs
  # Owner role — DDL only (alembic). Pinned here so a stale localhost value in
  # someone's .env cannot leak in through env_file below.
  DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@postgres:5432/cvs
  REDIS_URL: redis://redis:6379/0
  STORAGE_ROOT: /app/var/documents
  CANONICAL_BASE_URL: http://localhost:8000
  PYTHONUNBUFFERED: "1"
  ENV: ${ENV:-development}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-deterministic}
  AGENTS_PROVIDER: ${AGENTS_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  EMAIL_HOST: mailhog
  EMAIL_PORT: 1025
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
  EMAIL_FROM: ${EMAIL_FROM:-no-reply@cvs-saas.local}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Universo Profesional}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
  BRIGHTDATA_DATASET_ID: ${BRIGHTDATA_DATASET_ID:-gd_l1viktl72bvl7bjuj0}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_DMA_ENABLED: ${LINKEDIN_DMA_ENABLED:-false}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

services:
  postgres:
    # Postgres 16 + pgvector + Apache AGE. Built locally by default so a fresh
    # clone works with no registry access; set POSTGRES_IMAGE to a prebuilt tag
    # (see .github/workflows/publish-postgres.yml) to skip the ~5 min build.
    image: ${POSTGRES_IMAGE:-cvs-postgres:local}
    build:
      context: ./docker
      dockerfile: postgres.Dockerfile
    container_name: cvs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvs
      POSTGRES_PASSWORD: cvs_dev_password
      POSTGRES_DB: cvs
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # AGE requires being preloaded; pass the flag directly so it survives
    # docker-compose overriding the image's default CMD.
    command:
      - postgres
      - -c
      - shared_preload_libraries=age
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvs -d cvs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cvs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cvs-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- One-shot bootstrap: schema, then the runtime role, then seed data -----
  # Order is load-bearing and mirrors scripts/deploy_local_prod.sh:
  #   migrate (owner, creates tables) -> db-bootstrap (grants on those tables)
  #   -> esco-seed (writes into them) -> backend/worker (connect as cvs_app).
  # Without this chain a fresh clone deadlocks: esco-seed queries a table that
  # does not exist yet, so it fails; backend waits on esco-seed completing, so
  # it never starts; and `docker compose exec backend alembic upgrade head`
  # cannot run because there is no backend container to exec into.
  migrate:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: runtime
    container_name: cvs-migrate
    environment:
      # alembic needs DDL rights, so it connects as the owner role, not cvs_app.
      DATABASE_URL: postgresql+asyncpg://cvs:cvs_dev_password@postgres:5432/cvs
      DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@postgres:5432/cvs
      ENV: ${ENV:-development}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - backend_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: on-failure

  db-bootstrap:
    # Uses the postgres image because it is the only one here that ships psql,
    # and because provision_app_role.sql is the same file CI and prod run.
    image: ${POSTGRES_IMAGE:-cvs-postgres:local}
    container_name: cvs-db-bootstrap
    environment:
      PGPASSWORD: cvs_dev_password
    volumes:
      - ./backend/scripts:/scripts:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "psql -h postgres -U cvs -d cvs -v ON_ERROR_STOP=1 -q -f /scripts/provision_app_role.sql &&
             psql -h postgres -U cvs -d cvs -q -c \"ALTER ROLE cvs_app PASSWORD 'cvs_app_dev_password'\""
    restart: on-failure

  esco-seed:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: runtime
    container_name: cvs-esco-seed
    environment:
      DATABASE_URL: postgresql+asyncpg://cvs:cvs_dev_password@postgres:5432/cvs
      DATABASE_URL_SYNC: postgresql://cvs:cvs_dev_password@postgres:5432/cvs
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-development}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-deterministic}
      AUTO_SEED_ESCO: "true"
      ESCO_VERSION: ${ESCO_VERSION:-sample}
      ESCO_DOWNLOAD_URL: ${ESCO_DOWNLOAD_URL:-}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app
      - backend_var:/app/var
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    command: >
      sh -c "python -m scripts.seed_esco --sample-only"
    restart: on-failure

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    container_name: cvs-backend
    # Anything you put in .env reaches the container. The explicit `environment:`
    # block below still wins, so container-network values (DATABASE_URL, EMAIL_HOST)
    # survive the localhost defaults .env.example ships for non-Docker runs.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *shared-env
      # AgentOS ops substrate (P1.B) + tier-routed coordinator (P1.E) — dev-on.
      AGENTOS_ENABLED: ${AGENTOS_ENABLED:-true}
      AGENTS_TIER_ROUTING_ENABLED: ${AGENTS_TIER_ROUTING_ENABLED:-true}
      JWT_PRIVATE_KEY_PATH: /app/var/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/var/keys/jwt_public.pem
      FRONTEND_BASE_URL: http://localhost:5173
      PYTHONDONTWRITEBYTECODE: "1"
      AGENTS_COORDINATOR_MODEL: ${AGENTS_COORDINATOR_MODEL:-claude-sonnet-4-6}
      AGENTS_SPECIALIST_MODEL: ${AGENTS_SPECIALIST_MODEL:-claude-haiku-4-5-20251001}
      AUTO_VERIFY_EMAILS_IN_DEV: ${AUTO_VERIFY_EMAILS_IN_DEV:-false}
      # Stripe (real when STRIPE_PROVIDER=real)
      STRIPE_PROVIDER: ${STRIPE_PROVIDER:-mock}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${STRIPE_PRICE_PREMIUM_MONTHLY:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      esco-seed:
        condition: service_completed_successfully
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/worker.Dockerfile
      target: runtime
    restart: unless-stopped
    container_name: cvs-worker
    env_file:
      - path: .env
        required: false
    environment:
      # Same providers + secrets as the backend — the worker runs LLM extraction,
      # embedding refresh, OAuth-token-decrypting syncs and email sends. (It had
      # none before, silently no-op'ing those tasks.) See x-shared-env.
      <<: *shared-env
    volumes:
      - ./backend:/app
      - backend_var:/app/var
    depends_on:
      # Also connects as cvs_app, so it must wait for db-bootstrap like the API
      # does — otherwise it crash-loops until the role exists.
      redis:
        condition: service_healthy
      esco-seed:
        condition: service_completed_successfully
    command: arq src.shared.worker.WorkerSettings

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped
    container_name: cvs-frontend
    # Picks up VITE_* keys (e.g. VITE_SENTRY_DSN) from .env; Vite exposes any
    # VITE_-prefixed process env to the browser bundle.
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  backend_var:
  frontend_node_modules:
