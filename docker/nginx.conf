# nginx server block for the SPA + landing.
#
# Behaviour:
#   * /assets/*       — immutable hashed bundles → long cache.
#   * everything else — try the file, fall back to /index.html (SPA router).
#   * /api/, /agui/   — NOT proxied here. The frontend hits the backend on
#     its own public URL (configured via VITE_API_BASE_URL at build time).
#     If you want a single-origin setup, add proxy_pass to the backend below.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text payloads at the edge. Static assets are pre-compressed
    # by Vite (`build.brotli`) so we just need gzip for the cold path.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # Security headers. Frontend mirrors what the backend middleware sends
    # so static assets get protection even when the backend isn't involved.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP for the SPA itself. The backend serves its own CSP for JSON
    # responses; this is for the HTML shell.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com;" always;

    # Hashed assets get a year of cache. The filename changes when content
    # changes (Vite content-hashing), so this is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # Static metadata files don't change much but we keep them short-cached.
    location = /robots.txt {
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /favicon.ico {
        access_log off;
        expires 7d;
    }

    # Don't cache the HTML shell so deploys propagate immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # SPA fallback — any other path goes to index.html so the React router
    # can render it. Returns 404 only if `/index.html` itself is missing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
